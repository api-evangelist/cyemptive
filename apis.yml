aid: cyemptive
name: Cyemptive
description: 'Cyemptive Technologies is a cybersecurity vendor founded in 2014 by Rob
  Pike, headquartered in Washington State with additional offices in North Carolina,
  the United Kingdom, France and India. It sells preemptive, detection-independent
  security to enterprise and government buyers under the Cyemptive ZeroStrike brand
  — built on its patented CyberSlice technology — alongside ZeroStrike Cloud Command,
  ZeroStrike Blueprint professional services, Compliancy Cloud and a cyber-insurance
  offering. Cyemptive is sold as a delivered end-user security product through a direct
  and partner motion; it publishes no public developer program, API reference or
  machine-readable contract of any kind.'
